name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: DIAG - node check
        run: echo "=== NODE OK ===" && node --eval "console.log('node works')"
      - name: DIAG - pwd & ls
        run: |
          echo "=== PWD ===" && pwd
          echo "=== LS ===" && ls -la
          echo "=== ASTRO BIN ===" && ls -la node_modules/astro/bin/astro.mjs
      - name: DIAG - npm run build (redirect stderr)
        run: npm run build 2>&1
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
