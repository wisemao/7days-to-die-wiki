name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Astro type check
        run: npx astro check
      - name: Validate data
        run: npm run validate
        continue-on-error: true
      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production
      - name: Pagefind output diagnostics
        run: |
          echo "PAGEFIND_META=$(find dist/pagefind -maxdepth 1 -name '*.pf_meta' | wc -l)" > dist/pagefind-debug.txt
          echo "PAGEFIND_INDEX=$(find dist/pagefind -name '*.pf_index' | wc -l)" >> dist/pagefind-debug.txt
          echo "PAGEFIND_FRAGMENT=$(find dist/pagefind -name '*.pf_fragment' | wc -l)" >> dist/pagefind-debug.txt
          find dist/pagefind -maxdepth 2 -type f | head -30 >> dist/pagefind-debug.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
